name: "🎨 Lint"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "🎨 Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-node-env

      - name: Build Configs
        run: pnpm --filter "@yuva-devlab/*-config" build

      - name: Run Lint
        run: pnpm run lint
