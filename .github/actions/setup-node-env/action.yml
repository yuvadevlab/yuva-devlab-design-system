name: "Setup Node Environment"
description: "Sets up Node.js, pnpm, installs dependencies, and configures Turborepo caching."
runs:
  using: "composite"
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: "pnpm"

    - name: Install Dependencies
      shell: bash
      run: pnpm install

    - name: Cache Turborepo
      uses: actions/cache@v5
      with:
        path: .turbo
        key: ${{ runner.os }}-turbo-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-turbo-
